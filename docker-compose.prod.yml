version: '3.8'

services:
  frontend:
    container_name: airsight-frontend
    image: airsight-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "4173:4173"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  backend:
    container_name: airsight-backend
    image: airsight-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  sqlite_data:
    driver: local